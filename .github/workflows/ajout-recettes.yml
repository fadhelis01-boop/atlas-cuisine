# Ajout de recettes sans coder : enregistre des liens dans recettes-classees/a_ajouter.md (sur github.com ou l'appli GitHub),
# cette automatisation les lit, les classe, régénère les données de l'application, la reconstruit (48 contrôles) et la publie.
name: Ajouter des recettes
on:
  push:
    branches: [main]
    paths: [recettes-classees/a_ajouter.md]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ajout-recettes, cancel-in-progress: false }
jobs:
  ajout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Lire et classer les liens
        working-directory: recettes-classees
        run: python ajout_auto.py
      - name: Régénérer les données de l'application
        working-directory: bible
        run: python export_app_data.py
      - name: Construire (contrôles compris)
        working-directory: app
        run: npm ci && npm run build
      - name: Enregistrer le classement
        run: |
          git config user.name "atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recettes-classees bible app/src/data
          git diff --cached --quiet || git commit -m "Ajout automatique de recettes depuis a_ajouter.md"
          git push
      - name: Publier
        working-directory: app
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: node scripts/deploy.mjs
